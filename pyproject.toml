[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-calculator"
version = "0.1.0"
requires-python = ">=3.9"
description = "Modular CLI calculator with tests and CI"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Coverage config (enforce 100% and omit CLI entrypoint) ----
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/main.py",        # exclude CLI entrypoint from coverage
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
exclude_lines = [
  "pragma: no cover",
]
